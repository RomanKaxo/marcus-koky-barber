<main class="admin container" id="obsah">

<div class="admin-top">
<div>

<h1 id="day-title">Pondělí 16. listopadu</h1>
</div>
<div class="toolbar">

<button type="button" role="tab" aria-selected="false" data-view="week">Týden</button>
</div>
<div class="date-nav">

</div>
</div>
</div>
